; Stations with nothing to measure, just the RC522 reader and the LED strip:
; pot, plate and delivery. The game server does all the work for these; only the
; StationKind differs, chosen by the environment: `pio run -e pot -t upload`.
; Shares its libraries with the other stations through ../shared.

[platformio]
default_envs = pot, plate, delivery

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_extra_dirs = ../shared
lib_deps =
	miguelbalboa/MFRC522@^1.4.11
	adafruit/Adafruit NeoPixel@^1.12.3

[env:pot]
build_flags = -DSTATION_POT

[env:plate]
build_flags = -DSTATION_PLATE

[env:delivery]
build_flags = -DSTATION_DELIVERY
