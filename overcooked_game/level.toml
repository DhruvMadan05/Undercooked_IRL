# Level definition: the stations in play, the ingredients and how they are
# processed, the menu and the scoring. Everything here is a placeholder menu;
# change it freely, the server reads it at startup.

[level]
duration_s = 180        # length of a round
countdown_s = 3         # 3-2-1 before the round starts
order_interval_s = 25   # a new order appears this often ...
max_orders = 4          # ... as long as fewer than this many are open
order_time_s = 90       # default time to deliver an order (a recipe can override it)
expire_penalty = 10     # points lost when an order runs out
dump_penalty = 5        # points lost when a plate that matches no order is dumped at delivery
time_bonus = 20         # extra points for a fast delivery (scaled by time left)
respawn_s = 3           # delivered (or trashed) food tags come back as RAW after this
plate_capacity = 4      # ingredients that fit on one plate
wash_s = 5              # seconds of scrubbing at the sink to clean a dirty plate

# How many of each station the level needs. The calibration wizard asks you to
# touch the calibration tag to each of them.
# A plate reader IS a plate: food put on it goes onto that plate, no scan step.
# Each plate has its own tag, which is touched to the delivery station to serve
# what is on the plate reader (the wizard pairs each tag with its reader).
[stations]
cutting_board = 1
pan = 1
deep_fryer = 1
plate = 2
delivery = 1
sink = 1

# Ingredients: how many tags to enrol, and which stations can process them.
#   cutting_board = { goal = presses }               raw -> chopped
#   pan           = { goal = gestures, seconds = t, bonus_s = t, bonus_cap_s = t, patterns = [".."] }
#                   raw -> cooked. Simon Says: the pan asks for one random joystick gesture at a
#                   time (from patterns, default all: circle zigzag hold shake press flick); every
#                   correct one gives back bonus_s x chain length (up to bonus_cap_s) of the
#                   seconds budget. Burnt if goal gestures are not done in time.
#   deep_fryer    = { goal = N }                     raw -> cooked (hand-height tracking minigame)
# Optional in any of them: from = "raw", to = "cooked" (states: raw, chopped, cooked).
# An ingredient with no processing (bun) goes straight onto a plate.
[ingredient.tomato]
count = 3
cutting_board = { goal = 50 }

[ingredient.lettuce]
count = 3
cutting_board = { goal = 120 }

[ingredient.patty]
count = 2
pan = { goal = 8, seconds = 30, bonus_s = 0.5, bonus_cap_s = 3 }

[ingredient.potato]
count = 2
deep_fryer = { goal = 100 }

[ingredient.bun]
count = 2

# Recipes: what has to be on the plate, as "ingredient:state".
[recipe.salad]
needs = ["tomato:chopped", "lettuce:chopped"]
points = 100

[recipe.burger]
needs = ["patty:cooked", "bun:raw", "lettuce:chopped"]
points = 150

[recipe.fries]
needs = ["potato:cooked"]
points = 90
