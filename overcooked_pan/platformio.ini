; Frying pan station: a joystick moved in a pattern (see src/main.cpp).
; Shares its libraries with the other stations through ../shared.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_extra_dirs = ../shared
lib_deps =
	miguelbalboa/MFRC522@^1.4.11
	adafruit/Adafruit NeoPixel@^1.12.3
	adafruit/Adafruit SSD1306@^2.5.17
	adafruit/Adafruit GFX Library@^1.12.6
	adafruit/Adafruit BusIO@^1.17.4

; Host-side unit tests for the pattern logic: `pio test -e native`.
[env:native]
platform = native
build_flags = -Isrc
lib_ignore = TagReader, StationCore, OvercookedComm
test_build_src = no
