; Sink station: scrub a joystick in circles to wash a dirty plate (see src/main.cpp).
; Shares its libraries with the other stations through ../shared.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_extra_dirs = ../shared
lib_deps =
	miguelbalboa/MFRC522@^1.4.11
	adafruit/Adafruit NeoPixel@^1.12.3

; Host-side unit tests for the scrubbing logic: `pio test -e native`.
; -std=gnu++17: see the note in ../deep_fryer_station/platformio.ini.
[env:native]
platform = native
build_flags = -Isrc -std=gnu++17
lib_ignore = TagReader, StationCore, OvercookedComm
test_build_src = no
