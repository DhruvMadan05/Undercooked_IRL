; Deep fryer station: track a roaming target with the hand's height over an
; HC-SR04 to fry an item (see src/main.cpp). Shares its libraries with the
; other stations through ../shared.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_extra_dirs = ../shared
lib_deps =
	miguelbalboa/MFRC522@^1.4.11
	adafruit/Adafruit NeoPixel@^1.12.3
	adafruit/Adafruit SSD1306@^2.5.17
	adafruit/Adafruit GFX Library@^1.12.6
	adafruit/Adafruit BusIO@^1.17.4

; Host-side unit tests for the scoring logic: `pio test -e native`.
; -std=gnu++17: this machine's system clang defaults to a pre-C++11 standard
; for the native platform, which chokes on constexpr/uint32_t/enum class in
; FryTracker.h (the same is true of the other stations' native envs).
[env:native]
platform = native
build_flags = -Isrc -std=gnu++17
lib_ignore = TagReader, StationCore, OvercookedComm
test_build_src = no
